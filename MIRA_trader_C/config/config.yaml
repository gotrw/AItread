# MIRA_trader_C – Main Configuration
# All key parameters are driven from this file. Do NOT hardcode values elsewhere.
# Per-symbol overrides live in config/symbols/<SYMBOL>.yaml

# ──────────────────────────────────────────────────────────────
# Runtime mode:  paper | live | backtest | scanner
# ──────────────────────────────────────────────────────────────
mode: paper

# ──────────────────────────────────────────────────────────────
# Exchange / Data
# ──────────────────────────────────────────────────────────────
exchange:
  name: binance          # any CCXT-supported exchange id
  # API credentials are loaded from environment variables:
  #   MIRA_API_KEY, MIRA_API_SECRET
  # Leave blank here – never commit secrets to source control.
  api_key: ""
  api_secret: ""
  testnet: true          # use exchange testnet when mode=live
  futures: true          # enable futures market (USDT-margined perpetuals)

data:
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h          # 1m 5m 15m 1h 4h 1d
  lookback_candles: 500  # candles to fetch on startup
  provider: ccxt         # ccxt | csv  (csv useful for backtesting)
  csv_dir: data/csv      # used only when provider=csv

# ──────────────────────────────────────────────────────────────
# Futures-specific settings (global defaults, per-symbol override in symbols/)
# ──────────────────────────────────────────────────────────────
futures:
  leverage: 5                    # default leverage (1 = no leverage)
  margin_type: isolated          # isolated | cross
  liquidation_buffer_pct: 20     # close position when within this % of liquidation price
  funding_rate_interval_hours: 8 # funding charged every N hours (simulation)
  default_funding_rate: 0.0001   # 0.01% per interval (backtest default)

# ──────────────────────────────────────────────────────────────
# Strategy
# ──────────────────────────────────────────────────────────────
strategy:
  active: multi_strategy  # trend_follow | mean_reversion | breakout | volatility | multi_strategy
  # regime-aware multi-strategy selects the best sub-strategy for market conditions
  multi_strategy:
    strategies:
      - trend_follow
      - mean_reversion
      - breakout
      - volatility
    min_votes: 2              # minimum strategy votes to open a position
    regime_aware: true        # let regime detection guide strategy selection

  trend_follow:
    fast_ema: 9
    slow_ema: 21
    signal_ema: 9
    rsi_period: 14
    rsi_buy_threshold: 50
    rsi_sell_threshold: 50

  mean_reversion:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 35
    rsi_overbought: 65

  breakout:
    atr_period: 14
    lookback: 20          # candles to measure range high/low
    atr_multiplier: 1.5   # breakout must exceed range ± ATR*multiplier

  volatility:
    bb_period: 20
    bb_std: 2.0
    atr_period: 14
    squeeze_threshold: 0.02   # BB width/price ratio below this = squeeze
    expansion_multiplier: 1.5 # ATR expansion factor to confirm breakout

  regime:
    adx_period: 14
    adx_trending_threshold: 25   # ADX > this → trending regime
    atr_period: 14
    atr_volatile_multiplier: 1.5 # ATR/SMA ratio above this → volatile regime
    lookback: 50                 # candles for regime detection

# ──────────────────────────────────────────────────────────────
# Signal Scanner
# ──────────────────────────────────────────────────────────────
scanner:
  enabled: true
  interval_seconds: 300      # scan all symbols every 5 minutes
  min_confidence: 0.3        # only emit signals above this confidence
  signal_log_file: logs/signal_log.jsonl
  send_telegram: true        # send new signals to Telegram

# ──────────────────────────────────────────────────────────────
# Risk Management
# ──────────────────────────────────────────────────────────────
risk:
  initial_capital: 1000.0          # USD (paper/backtest starting balance)
  max_risk_per_trade_pct: 1.0      # % of capital risked per trade
  max_daily_loss_pct: 3.0          # halt trading if daily loss exceeds this
  max_open_positions: 3
  max_exposure_per_symbol_pct: 30  # % of capital per symbol
  max_total_exposure_pct: 80       # % of total portfolio in open positions
  stop_loss_pct: 1.5               # default stop-loss from entry
  take_profit_pct: 3.0             # default take-profit from entry
  trailing_stop: false
  trailing_stop_pct: 1.0
  cooldown_after_loss_trades: 3    # skip N trades after a losing trade
  kill_switch: false               # set true to halt all trading immediately
  risk_log_file: logs/risk_log.jsonl

# ──────────────────────────────────────────────────────────────
# Backtesting
# ──────────────────────────────────────────────────────────────
backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  fee_rate: 0.0004         # 0.04 % taker fee (futures)
  slippage_pct: 0.05       # 0.05 % slippage per trade
  simulate_funding: true   # apply funding rate charges in simulation
  simulate_liquidation: true  # force-close if liquidation price is hit

# ──────────────────────────────────────────────────────────────
# Notifications (Telegram)
# ──────────────────────────────────────────────────────────────
notifications:
  telegram:
    enabled: false         # set true to enable Telegram alerts
    # Credentials loaded from environment variables:
    #   MIRA_TELEGRAM_TOKEN, MIRA_TELEGRAM_CHAT_ID
    bot_token: ""
    chat_id: ""
    send_signals: true     # alert on new scanner signals
    send_orders: true      # alert on order fills
    send_risk_events: true # alert on risk events (daily loss, kill-switch)
    send_errors: true      # alert on system errors
    batch_summary_hours: 1 # send summary every N hours (0 = disable)

# ──────────────────────────────────────────────────────────────
# Self-Learning System
# ──────────────────────────────────────────────────────────────
learning:
  tune_interval_hours: 24   # run learning cycle every N hours (paper/live)
  weight_lookback: 100      # max recent trades for weight tuning
  threshold_lookback: 30    # recent trades for confidence threshold
  min_samples: 10           # min trades per strategy before adjusting weight
  min_weight: 0.5           # clamp lower bound on strategy vote-weight
  max_weight: 3.0           # clamp upper bound on strategy vote-weight
  conservative_confidence: 0.70  # min_confidence raised when win rate < 45%
  guard_min_trades: 20      # min journal trades before backtest guard runs
  guard_acceptance_ratio: 0.9   # accept new weights if Sharpe drops ≤ 10%

# ──────────────────────────────────────────────────────────────
# Monitoring & Logging
# ──────────────────────────────────────────────────────────────
monitoring:
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR
  log_file: logs/mira.log
  metrics_file: logs/metrics.json
  trade_journal_file: logs/trade_journal.jsonl   # learning system trade log
  print_trades: true
