# MIRA_trader_C – Main Configuration
# All key parameters are driven from this file. Do NOT hardcode values elsewhere.

# ──────────────────────────────────────────────────────────────
# Runtime mode:  paper | live | backtest
# ──────────────────────────────────────────────────────────────
mode: paper

# ──────────────────────────────────────────────────────────────
# Exchange / Data
# ──────────────────────────────────────────────────────────────
exchange:
  name: binance          # any CCXT-supported exchange id
  # API credentials are loaded from environment variables:
  #   MIRA_API_KEY, MIRA_API_SECRET
  # Leave blank here – never commit secrets to source control.
  api_key: ""
  api_secret: ""
  testnet: true          # use exchange testnet when mode=live

data:
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h          # 1m 5m 15m 1h 4h 1d
  lookback_candles: 500  # candles to fetch on startup
  provider: ccxt         # ccxt | csv  (csv useful for backtesting)
  csv_dir: data/csv      # used only when provider=csv

# ──────────────────────────────────────────────────────────────
# Strategy
# ──────────────────────────────────────────────────────────────
strategy:
  active: multi_strategy  # trend_follow | mean_reversion | breakout | multi_strategy
  multi_strategy:
    strategies:
      - trend_follow
      - mean_reversion
      - breakout
    # minimum votes required to open a position
    min_votes: 2

  trend_follow:
    fast_ema: 9
    slow_ema: 21
    signal_ema: 9
    rsi_period: 14
    rsi_buy_threshold: 50
    rsi_sell_threshold: 50

  mean_reversion:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 35
    rsi_overbought: 65

  breakout:
    atr_period: 14
    lookback: 20          # candles to measure range high/low
    atr_multiplier: 1.5   # breakout must exceed range ± ATR*multiplier

# ──────────────────────────────────────────────────────────────
# Risk Management
# ──────────────────────────────────────────────────────────────
risk:
  initial_capital: 1000.0          # USD (paper/backtest starting balance)
  max_risk_per_trade_pct: 1.0      # % of capital risked per trade
  max_daily_loss_pct: 3.0          # halt trading if daily loss exceeds this
  max_open_positions: 3
  max_exposure_per_symbol_pct: 30  # % of capital per symbol
  stop_loss_pct: 1.5               # default stop-loss from entry
  take_profit_pct: 3.0             # default take-profit from entry
  trailing_stop: false
  trailing_stop_pct: 1.0
  cooldown_after_loss_trades: 3    # skip N trades after a losing trade
  kill_switch: false               # set true to halt all trading immediately

# ──────────────────────────────────────────────────────────────
# Backtesting
# ──────────────────────────────────────────────────────────────
backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  fee_rate: 0.001          # 0.1 % taker fee
  slippage_pct: 0.05       # 0.05 % slippage per trade

# ──────────────────────────────────────────────────────────────
# Monitoring & Logging
# ──────────────────────────────────────────────────────────────
monitoring:
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR
  log_file: logs/mira.log
  metrics_file: logs/metrics.json
  print_trades: true
