# Per-symbol config override for ETH/USDT
# Values here override the global config.yaml for this symbol only.
# Omit a key to inherit the global default.

# Futures settings for ETH/USDT
futures:
  leverage: 3
  margin_type: isolated

# Strategy override: ETH/USDT is more mean-reverting, use wider BB
strategy:
  active: multi_strategy
  multi_strategy:
    strategies:
      - trend_follow
      - mean_reversion
      - breakout
    min_votes: 2
    regime_aware: true
  mean_reversion:
    bb_period: 20
    bb_std: 2.0
    rsi_oversold: 32
    rsi_overbought: 68
  trend_follow:
    fast_ema: 12
    slow_ema: 26
    rsi_buy_threshold: 50
    rsi_sell_threshold: 50

# Risk override for ETH/USDT
risk:
  max_risk_per_trade_pct: 0.8
  stop_loss_pct: 2.0
  take_profit_pct: 4.0
  max_exposure_per_symbol_pct: 25
